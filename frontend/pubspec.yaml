name: capital_care
description: "A modernized CRM app built with Flutter and Riverpod."
publish_to: "none"
version: 1.0.1+9

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI / Assets
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1

  # Core / State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Network & Auth
  http: ^1.2.1
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1
  flutter_phone_direct_caller: ^2.1.1
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # build_runner: ^2.4.9
  # riverpod_generator: ^2.4.0
  # riverpod_annotation: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
